<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0b1d12">

<style>
  :root { --red:#c8102e; --gold:#d9ac3b; --navy:#0d2b5e; --ink:#101418; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family:Oswald,"Arial Narrow",Impact,system-ui,sans-serif; touch-action:none; color:#fff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; aspect-ratio:16/9; width:min(100vw,177.78vh); container-type:inline-size; background:#0b1d12; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hidden { display:none !important; }
  button { font:inherit; font-weight:800; color:#fff; border:0; cursor:pointer; letter-spacing:.04em; }

  .overlay { position:absolute; inset:0; background:rgba(8,14,10,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.6cqw; text-align:center; padding:2cqw; }
  .logo { width:11cqw; filter:drop-shadow(0 .5cqw 1cqw rgba(0,0,0,.6)); }
  .logo svg { width:100%; display:block; }
  .overlay h1 { margin:0; font-size:6.2cqw; line-height:1; font-style:italic; letter-spacing:.03em; text-shadow:.3cqw .3cqw 0 var(--red); }
  .overlay h1 span { color:var(--gold); }
  .overlay p { margin:0; font-size:1.7cqw; opacity:.85; max-width:60cqw; }
  .row { display:flex; gap:1.2cqw; flex-wrap:wrap; justify-content:center; }
  .big { background:var(--red); font-size:2.2cqw; padding:1.1cqw 3.2cqw; border-radius:.9cqw; box-shadow:0 .5cqw 0 #7d0a1d; }
  .opt { background:#27323a; font-size:1.6cqw; padding:.9cqw 1.8cqw; border-radius:.8cqw; }
  .opt.sel { background:var(--gold); color:#1a1405; }

  .panel { position:absolute; background:rgba(8,14,10,.82); border:.15cqw solid rgba(255,255,255,.18); border-radius:1cqw; padding:1.1cqw; }
  #call { left:1.5cqw; top:11.8cqw; width:23.5cqw; backdrop-filter:blur(.6cqw); display:flex; flex-direction:column; gap:.6cqw; }
  #call h3, #fourth h3 { margin:0 0 .3cqw; font-size:1.3cqw; letter-spacing:.12em; color:var(--gold); }
  .play { display:flex; align-items:center; gap:.9cqw; text-align:left; background:linear-gradient(180deg,#2e3b45,#1c252c); padding:.45cqw .8cqw; border-radius:.7cqw; font-size:1.35cqw; border:.1cqw solid rgba(255,255,255,.08); }
  .play canvas { position:static; width:5.2cqw; height:3.6cqw; flex:none; border-radius:.4cqw; background:#16361d; }
  .play span { display:block; }
  .play small { display:block; font-weight:500; opacity:.7; font-size:.95cqw; letter-spacing:0; margin-top:.1cqw; }
  .play.sel { background:linear-gradient(180deg,#e0213d,#8f0b21); border-color:rgba(255,255,255,.5); box-shadow:0 0 1.4cqw rgba(200,16,46,.55); }
  #hike { background:var(--gold); color:#1a1405; font-size:1.8cqw; padding:.9cqw; border-radius:.7cqw; margin-top:.3cqw; }
  #fourth { left:50%; top:13cqw; transform:translateX(-50%); display:flex; flex-direction:column; gap:.7cqw; align-items:stretch; width:26cqw; text-align:center; }
  #fourth button { background:#27323a; font-size:1.5cqw; padding:.8cqw; border-radius:.6cqw; }
  #fourth button:first-of-type { background:var(--red); }
  #fourth button:disabled { opacity:.35; }
  #kick { left:50%; top:14cqw; transform:translateX(-50%); width:40cqw; text-align:center; }
  #meter { position:relative; height:2.6cqw; background:#27323a; border-radius:1.3cqw; overflow:hidden; margin:.8cqw 0; }
  #zone { position:absolute; top:0; bottom:0; background:#2fbf71; opacity:.85; }
  #pin { position:absolute; top:-.2cqw; bottom:-.2cqw; width:.7cqw; background:#fff; border-radius:.3cqw; }
  #kickBtn { background:var(--red); font-size:1.8cqw; padding:.8cqw 3cqw; border-radius:.7cqw; }
  #btns { position:absolute; right:2cqw; bottom:9.5cqw; display:flex; flex-direction:column; gap:1cqw; }
  #btns button { background:rgba(200,16,46,.9); width:8cqw; height:8cqw; border-radius:50%; font-size:1.6cqw; border:.3cqw solid #fff; }
  #btns button#scramble { background:rgba(13,43,94,.92); }
  #drive { left:50%; top:12cqw; transform:translateX(-50%); width:46cqw; }
  #drive h3 { margin:0 0 .6cqw; font-size:1.3cqw; letter-spacing:.12em; color:var(--gold); }
  #driveLog { font-size:1.45cqw; line-height:1.5; min-height:9cqw; }
  #driveLog div:last-child { color:var(--gold); font-weight:800; }
  #banner { position:absolute; left:26cqw; right:0; top:12cqw; text-align:center; pointer-events:none; font-size:3.4cqw; font-weight:900; font-style:italic; letter-spacing:.04em; text-shadow:.25cqw .25cqw 0 #000, 0 0 1.4cqw rgba(0,0,0,.6); }
  #banner.pop { animation:pop .35s ease-out; }
  @keyframes pop { from { transform:scale(.6); opacity:0 } to { transform:scale(1); opacity:1 } }
  #hint { position:absolute; left:0; right:0; bottom:8.6cqw; text-align:center; font-size:1.5cqw; font-weight:700; text-shadow:0 .1cqw .5cqw #000; pointer-events:none; }
  #rotate { display:none; position:absolute; inset:0; z-index:9; background:#0b1d12; align-items:center; justify-content:center; text-align:center; font-size:5cqw; padding:6cqw; }
  #place { position:absolute; left:2cqw; top:1.6cqw; font-size:1.7cqw; font-weight:700; letter-spacing:.14em; text-shadow:0 .1cqw .6cqw #000; z-index:3; }
  #online { position:absolute; left:50%; top:1.7cqw; transform:translateX(-50%); background:rgba(8,10,14,.78); border:.12cqw solid rgba(60,200,120,.7); color:#7dffb0; padding:.5cqw 1.6cqw; border-radius:2cqw; font-size:1.4cqw; font-weight:700; letter-spacing:.08em; z-index:3; white-space:nowrap; }
  #menuOnline { color:#7dffb0; font-weight:700; letter-spacing:.1em; font-size:1.6cqw; }
  #chat { position:absolute; left:2cqw; bottom:2.4cqw; width:34cqw; z-index:4; }
  #chatLog { font-size:1.4cqw; line-height:1.4; text-shadow:0 .1cqw .4cqw #000; margin-bottom:.5cqw; max-height:12cqw; overflow:hidden; }
  #chatLog div { background:rgba(8,10,14,.55); padding:.15cqw .7cqw; border-radius:.5cqw; margin-top:.2cqw; width:fit-content; max-width:100%; }
  #chatLog b { color:#ffd400; }
  #chatIn { width:100%; font:inherit; font-size:1.5cqw; padding:.6cqw 1cqw; border-radius:.8cqw; border:.12cqw solid rgba(255,255,255,.35); background:rgba(8,10,14,.75); color:#fff; user-select:text; -webkit-user-select:text; }
  #stage.talking #chat { display:none; }
  #emotes { position:absolute; right:2cqw; top:6.6cqw; display:flex; flex-direction:column; gap:.6cqw; z-index:4; }
  #emotes button { font-size:2.4cqw; background:rgba(8,10,14,.7); border:.12cqw solid rgba(255,255,255,.3); border-radius:50%; width:4.6cqw; height:4.6cqw; padding:0; }
  #stage.talking #emotes { display:none; }
  #skip { position:absolute; right:2cqw; top:1.6cqw; background:rgba(8,10,14,.75); padding:.7cqw 1.6cqw; border-radius:.8cqw; font-size:1.5cqw; border:.12cqw solid rgba(255,255,255,.4); z-index:3; }
  #joy { position:absolute; left:3cqw; bottom:12cqw; width:14cqw; height:14cqw; border-radius:50%; background:rgba(255,255,255,.1); border:.25cqw solid rgba(255,255,255,.35); touch-action:none; z-index:3; }
  #knob { position:absolute; left:50%; top:50%; width:6cqw; height:6cqw; border-radius:50%; background:rgba(255,255,255,.55); transform:translate(-50%,-50%); }
  #act { position:absolute; right:3cqw; bottom:5cqw; min-width:11cqw; height:7cqw; padding:0 2cqw; border-radius:3.5cqw; background:#ffd400; color:#1a1405; font-size:2cqw; border:.3cqw solid #fff; z-index:3; }
  @media (pointer:fine) { #joy { display:none; } }
  #stage.talking #wui { display:none; }
  #card { position:absolute; inset:0; background:rgba(4,6,10,.78); display:flex; align-items:center; justify-content:center; z-index:7; }
  .cardIn { display:flex; gap:2.4cqw; background:linear-gradient(160deg,#1b1018,#0a0a10); border:.25cqw solid #d9ac3b; border-radius:1.4cqw; padding:2cqw; box-shadow:0 0 5cqw rgba(200,16,46,.45); max-width:80cqw; }
  .cardL { position:relative; } #cardArt { position:static; width:20cqw; height:26cqw; border-radius:1cqw; border:.2cqw solid #d9ac3b; }
  #cardOvr { position:absolute; left:.9cqw; top:.9cqw; width:4.8cqw; height:4.8cqw; border-radius:50%; background:#ffd400; color:#1a1405; font-size:2.6cqw; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .cardR { width:34cqw; } #cardPos { color:#ffd400; font-size:1.5cqw; letter-spacing:.14em; font-weight:700; }
  #cardName { font-size:3.8cqw; font-weight:800; font-style:italic; line-height:1.05; } #cardNick { color:#d9ac3b; font-size:1.6cqw; margin:.3cqw 0 1cqw; }
  .bar { display:flex; align-items:center; gap:.9cqw; font-size:1.3cqw; margin:.5cqw 0; } .bar span { width:6cqw; font-weight:700; letter-spacing:.06em; } .bar i { flex:1; height:1.2cqw; background:rgba(255,255,255,.14); border-radius:.6cqw; overflow:hidden; display:block; } .bar b { display:block; height:100%; background:linear-gradient(90deg,#c8102e,#ffd400); } .bar em { width:3cqw; font-style:normal; text-align:right; font-weight:700; }
  #cardBio { font-size:1.4cqw; line-height:1.4; opacity:.9; margin:1cqw 0 .4cqw; } #cardSig { font-size:1.25cqw; color:#ffd400; font-weight:700; margin:0 0 1.2cqw; }
  #dlg { position:absolute; left:8cqw; right:8cqw; bottom:3cqw; background:rgba(8,10,14,.94); border:.2cqw solid #d9ac3b; border-radius:1.2cqw; padding:1.4cqw 2cqw; z-index:6; }
  #dlgWho { color:#ffd400; font-weight:700; font-size:1.7cqw; letter-spacing:.08em; margin-bottom:.3cqw; }
  #dlgText { font-size:2cqw; line-height:1.35; }
  #dlgOpts { display:flex; flex-direction:column; gap:.6cqw; margin-top:1cqw; }
  #dlgOpts button { text-align:left; background:#27323a; padding:.8cqw 1.2cqw; border-radius:.7cqw; font-size:1.7cqw; }
  #dlgOpts button:hover { background:#c8102e; }
  #dlgIn { display:flex; gap:1cqw; margin-top:1cqw; }
  #dlgInput { flex:1; font:inherit; font-size:2cqw; padding:.7cqw 1cqw; border-radius:.7cqw; border:.2cqw solid #d9ac3b; background:#10151a; color:#fff; user-select:text; -webkit-user-select:text; }
  #dlgHint { font-size:1.2cqw; opacity:.55; margin-top:.5cqw; text-align:right; }
  #end .score { font-size:7cqw; font-weight:900; }
  ol { list-style:none; padding:0; margin:0; }
  @media (orientation:portrait) {
    #stage { width:100vw; }
    #rotate { display:flex; position:fixed; }
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>

  <div id="banner"></div>
  <div id="place" class="hidden"></div>
  <div id="online" class="hidden"></div>
  <div id="chat" class="hidden"><div id="chatLog"></div><input id="chatIn" maxlength="120" placeholder="Press T to chat..." autocomplete="off"></div>
  <div id="emotes" class="hidden"><button data-e="wave">👋</button><button data-e="fire">🔥</button><button data-e="flex">💪</button><button data-e="clap">👏</button><button data-e="gg">🤝</button></div>
  <button id="skip" class="hidden">SKIP &#9654;</button>
  <div id="wui" class="hidden"><div id="joy"><div id="knob"></div></div><button id="act" class="hidden">ACT</button></div>
  <div id="card" class="hidden"><div class="cardIn">
    <div class="cardL"><canvas id="cardArt" width="260" height="340"></canvas><div id="cardOvr"></div></div>
    <div class="cardR"><div id="cardPos"></div><div id="cardName"></div><div id="cardNick"></div><div id="cardBars"></div><p id="cardBio"></p><p id="cardSig"></p>
    <div class="row" style="justify-content:flex-start"><button id="cardChat" class="big" style="font-size:1.8cqw;padding:.6cqw 2.2cqw">CHAT</button><button id="cardClose" class="opt">CLOSE</button></div></div></div></div>
  <div id="dlg" class="hidden">
    <div id="dlgWho"></div><div id="dlgText"></div>
    <div id="dlgOpts"></div>
    <div id="dlgIn" class="hidden"><input id="dlgInput" maxlength="20" autocomplete="off"><button id="dlgOk" class="big" style="font-size:1.8cqw;padding:.6cqw 2cqw">OK</button></div>
    <div id="dlgHint">TAP OR PRESS E TO CONTINUE</div>
  </div>
  <div id="hint"></div>

  <div id="menu" class="overlay">
    <div class="logo"><svg viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e23a52"/><stop offset="1" stop-color="#7d0a1d"/></linearGradient>
<linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d37a"/><stop offset="1" stop-color="#b98a22"/></linearGradient></defs>
<circle cx="60" cy="58" r="55" fill="url(#lg2)"/><circle cx="60" cy="58" r="49" fill="url(#lg1)"/>
<g transform="rotate(-32 60 54)"><ellipse cx="60" cy="54" rx="34" ry="19" fill="#fff"/><path d="M26 54h68" stroke="#c8102e" stroke-width="3"/><path d="M48 46v16M56 44v20M64 44v20M72 46v16" stroke="#c8102e" stroke-width="3" stroke-linecap="round"/><path d="M34 44q-6 10 0 20M86 44q6 10 0 20" stroke="#c8102e" stroke-width="3" fill="none"/></g>
<path d="M8 96h104l-8 18H16z" fill="#101418"/><path d="M8 96h104l-2 4H10z" fill="#d9ac3b"/>
<text x="60" y="112" text-anchor="middle" font-family="Oswald,Impact,sans-serif" font-weight="700" font-size="17" letter-spacing="3" fill="#fff">LIVE</text></svg></div>
    <h1>NFL <span>LIVE</span></h1>
    <p>Call the play. Throw it. Then run it in yourself.</p>
    <div class="row" id="modes">
      <button class="opt sel" data-mode="full">FULL GAME</button>
      <button class="opt" data-mode="final">FINAL DRIVE (2:25 left, down 3)</button>
    </div>
    <div class="row" id="diffs">
      <button class="opt" data-diff="rookie">ROOKIE</button>
      <button class="opt sel" data-diff="pro">PRO</button>
      <button class="opt" data-diff="allpro">ALL-PRO</button>
    </div>
    <div id="menuOnline" class="hidden"></div>
    <button class="opt sel" id="walkBtn">WALKABLE STADIUM: ON</button>
    <button id="start" class="big">ENTER THE STADIUM</button>
    <p style="font-size:1.3cqw;opacity:.6">Hold your finger or mouse where you want to run &middot; JUKE to dodge &middot; Tap a numbered receiver to throw</p>
  </div>

  <div id="call" class="panel hidden">
    <h3>CALL THE PLAY</h3>
    <div id="plays"></div>
    <button id="hike">HIKE!</button>
  </div>

  <div id="fourth" class="panel hidden">
    <h3>4TH DOWN</h3>
    <button id="goFor">GO FOR IT</button>
    <button id="punt">PUNT</button>
    <button id="fg">FIELD GOAL</button>
  </div>

  <div id="kick" class="panel hidden">
    <h3 id="kickTitle" style="margin:0;color:#d9ac3b;font-size:1.3cqw;letter-spacing:.12em">FIELD GOAL</h3>
    <div id="meter"><div id="zone"></div><div id="pin"></div></div>
    <button id="kickBtn">KICK!</button>
  </div>

  <div id="btns" class="hidden">
    <button id="juke">JUKE</button>
    <button id="scramble" class="hidden">RUN</button>
  </div>

  <div id="drive" class="panel hidden">
    <h3 id="driveTitle">DRIVE</h3>
    <div id="driveLog"></div>
  </div>

  <div id="end" class="overlay hidden">
    <h1 id="endTitle">FINAL</h1>
    <div class="score" id="endScore"></div>
    <p id="endSub"></p>
    <div class="row">
      <button id="again" class="big">PLAY AGAIN</button>
      <button id="share" class="opt">SHARE</button>
    </div>
  </div>
</div></div>
<div id="rotate">Turn your phone sideways to play</div>

<script>
(() => {
'use strict';
const W = 1280, H = 720;
const PX = 26, YP = 9.4, FIELD_TOP = 140, FW = 53.3, YC = 26.65;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const gauss = (m, s) => { let u = 0; for (let i = 0; i < 6; i++) u += Math.random(); return m + (u - 3) / 0.707 * s; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sx = x => (x - G.cam) * PX + W / 2;
const sy = y => FIELD_TOP + y * YP;
const ORD = ['1ST', '2ND', '3RD', '4TH'];

const TEAMS = {
  me:  { name: 'BAY CITY GOLD', short: 'BAY CITY', abbr: 'BCG', jersey: '#c8102e', jerseyL: '#e23a52', jerseyD: '#8f0b21', helmet: '#c9a02f', helmetL: '#f3d37a', pants: '#e0b84a', pantsD: '#a98a2a', num: '#ffffff', stripe: '#c8102e', glove: '#f5f5f5', ez: '#9c0f25', dark: '#7d0a1d' },
  cpu: { name: 'SUMMIT STALLIONS', short: 'SUMMIT', abbr: 'SUM', jersey: '#0d2b5e', jerseyL: '#2a56a8', jerseyD: '#071a3a', helmet: '#0d2b5e', helmetL: '#4a74c4', pants: '#d5d9e2', pantsD: '#9aa1b0', num: '#ff7a1a', stripe: '#ff7a1a', glove: '#ff7a1a', ez: '#0d2b5e', dark: '#071a3a' },
};

/* ---------------- game state ---------------- */
const G = {
  mode: 'full', diff: 'pro', phase: 'menu', t: 0, cam: 25,
  score: { me: 0, cpu: 0 }, q: 1, clock: 300, qLen: 300, ot: false, openingPoss: 'me',
  poss: 'me', x: 25, down: 1, fdx: 35, sel: 'inside', playClock: 25,
  play: null, resultT: 0, after: null, kick: null, td: null, particles: [], dust: [], shake: 0, drive: null, energy: 0.25, energyT: 0.25, zoom: 1, zoomT: 1, hitstop: 0, cap: null, rec: null, replay: null, replayDone: false,
  fakeScore: 0,
};
const DIFF = {
  rookie: { dm: 0.92, blitz: 0.15, block: 1.3, cpu: 0.85 },

  ctx.globalAlpha = e;
  ctx.fillStyle = 'rgba(8,10,14,.94)'; ctx.beginPath(); ctx.moveTo(bx + 20, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw - 24, by + 58); ctx.lineTo(bx, by + 58); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#d9ac3b'; ctx.beginPath(); ctx.arc(bx + 38, by + 29, 22, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a1405'; ctx.font = '800 24px Oswald, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t.who.num, bx + 38, by + 38);
  ctx.fillStyle = '#fff'; ctx.font = '700 32px Oswald, Impact, sans-serif'; ctx.textAlign = 'left'; ctx.fillText(t.label, bx + 76, by + 40);
  if (t.nick) { ctx.fillStyle = '#ffd400'; ctx.font = 'italic 600 22px Oswald, sans-serif'; ctx.textAlign = 'right'; ctx.fillText('“' + t.nick + '”', bx + bw - 46, by + 38); }
  ctx.globalAlpha = 1;
}

function draw() {
  if (G.phase === 'world') { drawWorld(); return; }
  if (G.phase === 'intro') { drawIntro(); return; }
  if (G.phase === 'replay') { drawReplay(); return; }
  ctx.save();
  if (G.zoom > 1.002) { ctx.translate(W / 2, 360); ctx.scale(G.zoom, G.zoom); ctx.translate(-W / 2, -360); }
  if (G.shake > 0.3) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  drawField(); drawLines(); drawRoutes(); drawBall(); drawPlayers(); drawDust(); drawSpeed();
  ctx.restore();
  ctx.drawImage(vig, 0, 0);
  G.particles.forEach(p => { ctx.fillStyle = p.c; ctx.globalAlpha = clamp(p.life, 0, 1); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 5); ctx.fillRect(-p.s / 2, -p.s * 0.3, p.s, p.s * 0.6); ctx.restore(); }); ctx.globalAlpha = 1;

}

let last = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts;
  try { update(dt); draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
