<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gridiron Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0b1d12">
<style>
  :root { --red:#c8102e; --gold:#d9ac3b; --navy:#0d2b5e; --ink:#101418; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family:Oswald,"Arial Narrow",Impact,system-ui,sans-serif; touch-action:none; color:#fff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; aspect-ratio:16/9; width:min(100vw,177.78vh); container-type:inline-size; background:#0b1d12; overflow:hidden; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hidden { display:none !important; }
  button { font:inherit; font-weight:800; color:#fff; border:0; cursor:pointer; letter-spacing:.04em; }

  .overlay { position:absolute; inset:0; background:rgba(8,14,10,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.6cqw; text-align:center; padding:2cqw; }
  .overlay h1 { margin:0; font-size:6.2cqw; line-height:1; font-style:italic; letter-spacing:.03em; text-shadow:.3cqw .3cqw 0 var(--red); }
  .overlay h1 span { color:var(--gold); }
  .overlay p { margin:0; font-size:1.7cqw; opacity:.85; max-width:60cqw; }
  .row { display:flex; gap:1.2cqw; flex-wrap:wrap; justify-content:center; }
  .big { background:var(--red); font-size:2.2cqw; padding:1.1cqw 3.2cqw; border-radius:.9cqw; box-shadow:0 .5cqw 0 #7d0a1d; }
  .opt { background:#27323a; font-size:1.6cqw; padding:.9cqw 1.8cqw; border-radius:.8cqw; }
  .opt.sel { background:var(--gold); color:#1a1405; }

  .panel { position:absolute; background:rgba(8,14,10,.82); border:.15cqw solid rgba(255,255,255,.18); border-radius:1cqw; padding:1.1cqw; }
  #call { left:1.5cqw; top:11.8cqw; width:23.5cqw; backdrop-filter:blur(.6cqw); display:flex; flex-direction:column; gap:.6cqw; }
  #call h3, #fourth h3 { margin:0 0 .3cqw; font-size:1.3cqw; letter-spacing:.12em; color:var(--gold); }
  .play { display:flex; align-items:center; gap:.9cqw; text-align:left; background:linear-gradient(180deg,#2e3b45,#1c252c); padding:.45cqw .8cqw; border-radius:.7cqw; font-size:1.35cqw; border:.1cqw solid rgba(255,255,255,.08); }
  .play canvas { position:static; width:5.2cqw; height:3.6cqw; flex:none; border-radius:.4cqw; background:#16361d; }
  .play span { display:block; }
  .play small { display:block; font-weight:500; opacity:.7; font-size:.95cqw; letter-spacing:0; margin-top:.1cqw; }
  .play.sel { background:linear-gradient(180deg,#e0213d,#8f0b21); border-color:rgba(255,255,255,.5); box-shadow:0 0 1.4cqw rgba(200,16,46,.55); }
  #hike { background:var(--gold); color:#1a1405; font-size:1.8cqw; padding:.9cqw; border-radius:.7cqw; margin-top:.3cqw; }
  #fourth { left:50%; top:13cqw; transform:translateX(-50%); display:flex; flex-direction:column; gap:.7cqw; align-items:stretch; width:26cqw; text-align:center; }
  #fourth button { background:#27323a; font-size:1.5cqw; padding:.8cqw; border-radius:.6cqw; }
  #fourth button:first-of-type { background:var(--red); }
  #fourth button:disabled { opacity:.35; }
  #kick { left:50%; top:14cqw; transform:translateX(-50%); width:40cqw; text-align:center; }
  #meter { position:relative; height:2.6cqw; background:#27323a; border-radius:1.3cqw; overflow:hidden; margin:.8cqw 0; }
  #zone { position:absolute; top:0; bottom:0; background:#2fbf71; opacity:.85; }
  #pin { position:absolute; top:-.2cqw; bottom:-.2cqw; width:.7cqw; background:#fff; border-radius:.3cqw; }
  #kickBtn { background:var(--red); font-size:1.8cqw; padding:.8cqw 3cqw; border-radius:.7cqw; }
  #btns { position:absolute; right:2cqw; bottom:9.5cqw; display:flex; flex-direction:column; gap:1cqw; }
  #btns button { background:rgba(200,16,46,.9); width:8cqw; height:8cqw; border-radius:50%; font-size:1.6cqw; border:.3cqw solid #fff; }
  #btns button#scramble { background:rgba(13,43,94,.92); }
  #drive { left:50%; top:12cqw; transform:translateX(-50%); width:46cqw; }
  #drive h3 { margin:0 0 .6cqw; font-size:1.3cqw; letter-spacing:.12em; color:var(--gold); }
  #driveLog { font-size:1.45cqw; line-height:1.5; min-height:9cqw; }
  #driveLog div:last-child { color:var(--gold); font-weight:800; }
  #banner { position:absolute; left:26cqw; right:0; top:12cqw; text-align:center; pointer-events:none; font-size:3.4cqw; font-weight:900; font-style:italic; letter-spacing:.04em; text-shadow:.25cqw .25cqw 0 #000, 0 0 1.4cqw rgba(0,0,0,.6); }
  #banner.pop { animation:pop .35s ease-out; }
  @keyframes pop { from { transform:scale(.6); opacity:0 } to { transform:scale(1); opacity:1 } }
  #hint { position:absolute; left:0; right:0; bottom:8.6cqw; text-align:center; font-size:1.5cqw; font-weight:700; text-shadow:0 .1cqw .5cqw #000; pointer-events:none; }
  #rotate { display:none; position:absolute; inset:0; z-index:9; background:#0b1d12; align-items:center; justify-content:center; text-align:center; font-size:5cqw; padding:6cqw; }
  #end .score { font-size:7cqw; font-weight:900; }
  ol { list-style:none; padding:0; margin:0; }
  @media (orientation:portrait) {
    #stage { width:100vw; }
    #rotate { display:flex; position:fixed; }
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="1280" height="720"></canvas>

  <div id="banner"></div>
  <div id="hint"></div>

  <div id="menu" class="overlay">
    <h1>GRIDIRON <span>LIVE</span></h1>
    <p>Call the play. Throw it. Then run it in yourself.</p>
    <div class="row" id="modes">
      <button class="opt sel" data-mode="full">FULL GAME</button>
      <button class="opt" data-mode="final">FINAL DRIVE (2:25 left, down 3)</button>
    </div>
    <div class="row" id="diffs">
      <button class="opt" data-diff="rookie">ROOKIE</button>
      <button class="opt sel" data-diff="pro">PRO</button>
      <button class="opt" data-diff="allpro">ALL-PRO</button>
    </div>
    <button id="start" class="big">KICK OFF</button>
    <p style="font-size:1.3cqw;opacity:.6">Hold your finger or mouse where you want to run &middot; JUKE to dodge &middot; Tap a numbered receiver to throw</p>
  </div>

  <div id="call" class="panel hidden">
    <h3>CALL THE PLAY</h3>
    <div id="plays"></div>
    <button id="hike">HIKE!</button>
  </div>

  <div id="fourth" class="panel hidden">
    <h3>4TH DOWN</h3>
    <button id="goFor">GO FOR IT</button>
    <button id="punt">PUNT</button>
    <button id="fg">FIELD GOAL</button>
  </div>

  <div id="kick" class="panel hidden">
    <h3 id="kickTitle" style="margin:0;color:#d9ac3b;font-size:1.3cqw;letter-spacing:.12em">FIELD GOAL</h3>
    <div id="meter"><div id="zone"></div><div id="pin"></div></div>
    <button id="kickBtn">KICK!</button>
  </div>

  <div id="btns" class="hidden">
    <button id="juke">JUKE</button>
    <button id="scramble" class="hidden">RUN</button>
  </div>

  <div id="drive" class="panel hidden">
    <h3 id="driveTitle">DRIVE</h3>
    <div id="driveLog"></div>
  </div>

  <div id="end" class="overlay hidden">
    <h1 id="endTitle">FINAL</h1>
    <div class="score" id="endScore"></div>
    <p id="endSub"></p>
    <div class="row">
      <button id="again" class="big">PLAY AGAIN</button>
      <button id="share" class="opt">SHARE</button>
    </div>
  </div>
</div></div>
<div id="rotate">Turn your phone sideways to play</div>

<script>
(() => {
'use strict';
const W = 1280, H = 720;
const PX = 26, YP = 9.4, FIELD_TOP = 140, FW = 53.3, YC = 26.65;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const gauss = (m, s) => { let u = 0; for (let i = 0; i < 6; i++) u += Math.random(); return m + (u - 3) / 0.707 * s; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const sx = x => (x - G.cam) * PX + W / 2;
const sy = y => FIELD_TOP + y * YP;
const ORD = ['1ST', '2ND', '3RD', '4TH'];

const TEAMS = {
  me:  { name: 'BAY CITY GOLD', short: 'BAY CITY', abbr: 'BCG', jersey: '#c8102e', jerseyL: '#e23a52', jerseyD: '#8f0b21', helmet: '#c9a02f', helmetL: '#f3d37a', pants: '#e0b84a', pantsD: '#a98a2a', num: '#ffffff', stripe: '#c8102e', glove: '#f5f5f5', ez: '#9c0f25', dark: '#7d0a1d' },
  cpu: { name: 'SUMMIT STALLIONS', short: 'SUMMIT', abbr: 'SUM', jersey: '#0d2b5e', jerseyL: '#2a56a8', jerseyD: '#071a3a', helmet: '#0d2b5e', helmetL: '#4a74c4', pants: '#d5d9e2', pantsD: '#9aa1b0', num: '#ff7a1a', stripe: '#ff7a1a', glove: '#ff7a1a', ez: '#0d2b5e', dark: '#071a3a' },
};

/* ---------------- game state ---------------- */
const G = {
  mode: 'full', diff: 'pro', phase: 'menu', t: 0, cam: 25,
  score: { me: 0, cpu: 0 }, q: 1, clock: 300, qLen: 300, ot: false, openingPoss: 'me',
  poss: 'me', x: 25, down: 1, fdx: 35, sel: 'inside', playClock: 25,
  play: null, resultT: 0, after: null, kick: null, td: null, particles: [], dust: [], shake: 0, drive: null,
  fakeScore: 0,
};
const DIFF = {
  rookie: { dm: 0.92, blitz: 0.15, block: 1.3, cpu: 0.85 },
  pro:    { dm: 1.0,  blitz: 0.28, block: 1.0, cpu: 1.0 },
  allpro: { dm: 1.07, blitz: 0.42, block: 0.8, cpu: 1.12 },
};
const D = () => DIFF[G.diff];

/* ---------------- sound ---------------- */
let ac, crowdGain, noiseSrc;
function audio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = ac.sampleRate * 2, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      noiseSrc = ac.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 0.5;
      crowdGain = ac.createGain(); crowdGain.gain.value = 0.015;
      noiseSrc.connect(f); f.connect(crowdGain); crowdGain.connect(ac.destination); noiseSrc.start();
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function tone(f, d = 0.12, type = 'square', vol = 0.08, slide = 0) {
  try {
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), ac.currentTime + d);
    g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
function roar(level = 0.09, ms = 1800) {
  try {
    if (!crowdGain) return;
    const t = ac.currentTime;
    crowdGain.gain.cancelScheduledValues(t); crowdGain.gain.setValueAtTime(crowdGain.gain.value, t);
    crowdGain.gain.linearRampToValueAtTime(level, t + 0.2);
    crowdGain.gain.linearRampToValueAtTime(0.015, t + ms / 1000);
  } catch (e) {}
}
const sfx = {
  hike: () => tone(180, .08, 'square', .06),
  throw: () => tone(500, .22, 'sawtooth', .05, -300),
  hit: () => { tone(90, .15, 'sawtooth', .12, -40); tone(60, .2, 'square', .1); },
  whistle: () => { tone(2300, .35, 'sine', .06); },
  td: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .22, 'triangle', .1), i * 120)); roar(0.13, 3200); },
  bad: () => tone(160, .3, 'sawtooth', .08, -80),
  first: () => { tone(660, .1, 'triangle', .08); setTimeout(() => tone(880, .14, 'triangle', .08), 90); },
};

/* ---------------- UI helpers ---------------- */
const show = (el, on = true) => el.classList.toggle('hidden', !on);
let bannerTimer;
function banner(text, color = '#fff', ms = 1800) {
  const b = $('banner'); b.textContent = text; b.style.color = color;
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  clearTimeout(bannerTimer); bannerTimer = setTimeout(() => { b.textContent = ''; }, ms);
}
function hint(text) { $('hint').textContent = text || ''; }
const fmtClock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const ballOn = x => x < 50 ? 'OWN ' + Math.round(x) : x > 50 ? 'OPP ' + Math.round(100 - x) : 'MIDFIELD';
const qLabel = () => G.ot ? 'OT' : ORD[G.q - 1];
const toGo = () => Math.max(1, Math.round(G.fdx - G.x));
const downText = () => ORD[G.down - 1] + ' & ' + (G.fdx >= 100 ? 'GOAL' : toGo());

/* ---------------- players ---------------- */
function mk(side, role, x, y, spd, num, name) {
  return { side, role, x, y, vx: 0, vy: 0, spd, num, name: name || '', stun: 0, pinned: false, fallen: false,
    face: side === 'off' ? 1 : -1, t: Math.random() * 6, route: null, ri: 0, delay: 0, sx: x, sy: y,
    mode: 'idle', tp: null, home: null, react: 0, juke: 0, jcool: 0, slow: 0, grace: 0, target: null };
}
const OL_NUM = [62, 66, 64, 71, 75], DL_NUM = [91, 95, 97, 99], LB_NUM = [51, 54, 57], DB_NUM = [21, 24, 29, 31];

const PLAYS = {
  inside:  { name: 'INSIDE RUN',   sub: 'Hand off up the middle', type: 'run' },
  outside: { name: 'OUTSIDE RUN',  sub: 'Toss it wide, find the edge', type: 'run' },
  slants:  { name: 'QUICK SLANTS', sub: 'Short, fast passes', type: 'pass' },
  deep:    { name: 'DEEP SHOT',    sub: 'Go long, big risk', type: 'pass' },
  pa:      { name: 'PLAY ACTION',  sub: 'Fake the run, hit the seam', type: 'pass' },
  screen:  { name: 'SCREEN PASS',  sub: 'Dump to the back behind blockers', type: 'pass' },
};

function buildPlay(key) {
  const def = PLAYS[key], x0 = G.x, run = def.type === 'run', gun = !run && key !== 'screen' && key !== 'pa';
  const dm = D().dm;
  const lx = v => clamp(v, -9, 109);
  const O = (role, x, y, spd, num, name) => mk('off', role, lx(x), y, spd, num, name);
  const ol = [0, 1, 2, 3, 4].map(i => O('OL', x0 - 0.6, YC + (i - 2) * 2.6, 6, OL_NUM[i]));
  const qb = O('QB', x0 - (gun ? 4.6 : 1.4), YC, 6.4, 8, 'Jake Mercer');
  const rb = O('RB', x0 - (gun ? 4.6 : 5.2), YC + (gun ? 2.4 : 0), 8.2, 22, 'Dayo Okoye');
  const te = O('TE', x0 - 0.6, YC + 6.4, 7.5, 85, 'Marcus Keller');
  const wr1 = O('WR', x0 - 0.8, 8, 8.3, 11, 'Tunde Adeyemi');
  const wr2 = O('WR', x0 - 0.8, 45.3, 8.3, 84, 'Chris Bello');
  const wr3 = O('WR', x0 - 1.6, 17.5, 8.1, 17, 'Ryan Nwosu');
  const off = [...ol, qb, rb, te, wr1, wr2, wr3];
  const Df = (role, x, y, spd, num) => mk('def', role, lx(x), y, spd * dm, num);
  const dl = [-5, -1.7, 1.7, 5].map((o, i) => Df('DL', x0 + 1.0, YC + o, 6.7, DL_NUM[i]));
  const lb = [-6.5, 0, 6.5].map((o, i) => Df('LB', x0 + 4.6, YC + o, 7.3, LB_NUM[i]));
  const cb1 = Df('CB', x0 + 5.5, 8, 8.0, 21), cb2 = Df('CB', x0 + 5.5, 45.3, 8.0, 24);
  const s1 = Df('S', x0 + 13, 19, 7.9, 29), s2 = Df('S', x0 + 13, 33.5, 7.9, 31);
  const def_ = [...dl, ...lb, cb1, cb2, s1, s2];
  const P = {
    key, type: def.type, gun, off, def: def_, ol, qb, rb, te, wr1, wr2, wr3, dl, lb, cb1, cb2, s1, s2,
    pairs: [], t: 0, carrier: null, thrown: false, flight: null, handoff: false,
    cover: Math.random() < 0.5 ? 'man' : 'zone', blitz: !run && Math.random() < D().blitz,
    targets: [], ballHolder: qb, pocketWin: null,
  };
  G.cam = x0 + 6;

  const inward = p => p.y < YC ? 1 : -1;
  const R = (p, pts, delay = 0) => { p.route = pts.map(([dx, dy]) => ({ x: lx(p.sx + dx), y: clamp(p.sy + dy, 1.5, 51.8) })); p.ri = 0; p.delay = delay; p.mode = 'route'; };

  if (key === 'slants') {
    R(wr1, [[2, 0], [9, 6.5 * inward(wr1)]]); R(wr2, [[2, 0], [9, 6.5 * inward(wr2)]]);
    R(wr3, [[3, 0], [10, 5 * inward(wr3)]]); R(te, [[6, 0], [4.5, 0]]); R(rb, [[1, 7]]);
  } else if (key === 'deep') {
    R(wr1, [[34, 1.5 * inward(wr1)]]); R(wr2, [[11, 0], [31, 8 * inward(wr2)]]);
    R(wr3, [[9, 0], [24, -7 * inward(wr3)]]); R(te, [[6, 0], [7.5, -6]]); R(rb, [[2, -5]]);
  } else if (key === 'pa') {
    R(wr1, [[30, 1]]); R(wr2, [[11, 0], [11, 12 * inward(wr2)]]); R(wr3, [[26, 0]]); R(te, [[3, -2], [9, -12]], 0.3);
    rb.mode = 'fake';
  } else if (key === 'screen') {
    R(wr3, [[16, 0]]); R(te, [[1, 0]]); R(rb, [[2.5, 8]], 1.0);
    wr1.mode = 'blockwr'; wr2.mode = 'blockwr';
  }
  if (!run) P.targets = [wr1, wr2, te, wr3, rb];

  // block pairs
  const dur = run ? [1.6, 3.2] : [2.7 * D().block, 4.9 * D().block];
  const rushers = [...dl];
  if (P.blitz) { rushers.push(lb[0]); rushers.push(lb[2]); }
  const assign = (blockers, targets, arr) => {
    const free = targets.slice();
    blockers.slice().sort((a, b) => a.y - b.y).forEach(b => {
      if (!free.length) return;
      free.sort((p, q) => Math.abs(p.y - b.y) - Math.abs(q.y - b.y));
      const d = free.shift();
      arr.push({ a: b, d, state: arr.engaged ? 'on' : 'on', t: rand(dur[0], dur[1]), drift: run ? 1.0 : 0.45 });
    });
  };
  if (run) {
    assign(ol, [...dl, ...lb], P.pairs);
    if (Math.random() < 0.3) { const p = pick(P.pairs); p.t = rand(0.8, 1.1); }
    const edge = def_.filter(d => !P.pairs.some(pp => pp.d === d) && (d.role === 'LB' || d.role === 'DL'));
    if (edge.length) { edge.sort((a, b) => Math.abs(a.y - te.y) - Math.abs(b.y - te.y)); P.pairs.push({ a: te, d: edge[0], state: 'approach', t: rand(1.4, 2.6), drift: 0.8 }); }
    P.pairs.push({ a: wr1, d: cb1, state: 'approach', t: rand(1.4, 2.4), drift: 0.6 });
    P.pairs.push({ a: wr2, d: cb2, state: 'approach', t: rand(1.4, 2.4), drift: 0.6 });
    P.pairs.push({ a: wr3, d: s1, state: 'approach', t: rand(1.0, 2.0), drift: 0.6 });
    P.gap = rand(-1.6, 1.6); P.dir = Math.random() < 0.5 ? 1 : -1;
  } else {
    assign(ol, rushers, P.pairs);
    const loose = rushers.filter(r => !P.pairs.some(p => p.d === r));
    if (!P.blitz && P.pairs.length) { const w = pick(P.pairs); w.t = rand(1.7, 2.3) * D().block; }
    P.loose = loose;
    if (key === 'screen') {
      P.pairs.push({ a: te, d: lb[1], state: 'approach', t: 3, drift: 0.5 });
      P.pairs.push({ a: wr1, d: cb1, state: 'approach', t: 3, drift: 0.5 });
      P.pairs.push({ a: wr2, d: cb2, state: 'approach', t: 3, drift: 0.5 });
    }
  }
  // defense roles
  def_.forEach(d => { d.mode = 'idle'; });
  dl.forEach(d => d.mode = 'rush');
  if (run) {
    lb.forEach(d => { d.mode = 'pursue'; d.react = 0.3; });
    [cb1, cb2].forEach(d => { d.mode = 'pursue'; d.react = 0.7; });
    [s1, s2].forEach(d => { d.mode = 'pursue'; d.react = 0.9; });
  } else {
    const man = P.cover === 'man';

  ctx.fillText(G.phase === 'menu' ? 'GRIDIRON' : (G.poss === 'me' || G.phase === 'cpu' ? downText() : ''), cx, y + 24);
  ctx.font = '500 16px Oswald, sans-serif'; ctx.fillText(`${qLabel()}  |  ${fmtClock(G.clock)}`, cx, y + 41);
  ctx.font = '500 11px Oswald, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText(G.phase === 'menu' ? '' : 'BALL ON ' + ballOn(G.x), cx, y + 51);
  if (G.phase === 'precall') {
    ctx.fillStyle = '#0a0a0e'; rr(ctx, cx - 24, y - 26, 48, 26, 5); ctx.fill(); ctx.strokeStyle = G.playClock < 6 ? '#ff4d5e' : 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = G.playClock < 6 ? '#ff6b7a' : '#fff'; ctx.font = '700 19px Oswald, sans-serif'; ctx.fillText(Math.max(0, Math.ceil(G.playClock)), cx, y - 7);
  }
  ctx.fillStyle = '#fff'; for (let i = 0; i < 3; i++) { ctx.fillRect(L + 14 + i * 14, y + h - 6, 10, 2.5); ctx.fillRect(Rr - 52 + i * 14, y + h - 6, 10, 2.5); }
}

function drawTD() {
  const t = G.td; if (!t) return;
  const k = clamp(t.t / 0.4, 0, 1), e = 1 - Math.pow(1 - k, 3);
  if (t.t < 0.5) { ctx.fillStyle = `rgba(255,255,255,${(0.5 - t.t) * 0.9})`; ctx.fillRect(0, 0, W, H); }
  ctx.save(); ctx.translate(W / 2, 330); ctx.scale(0.4 + 0.6 * e, 0.4 + 0.6 * e); ctx.globalAlpha = e;
  ctx.font = 'italic 800 168px Oswald, Impact, sans-serif'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(255,50,80,.9)'; ctx.shadowBlur = 36;
  ctx.lineWidth = 22; ctx.strokeStyle = '#7d0a1d'; ctx.strokeText('TOUCHDOWN', 0, 0); ctx.shadowBlur = 0;
  const g = ctx.createLinearGradient(0, -130, 0, 10); g.addColorStop(0, '#ffffff'); g.addColorStop(0.55, '#dfe3ea'); g.addColorStop(1, '#a9b0bd'); ctx.fillStyle = g; ctx.fillText('TOUCHDOWN', 0, 0);
  ctx.lineWidth = 4; ctx.strokeStyle = '#ff4d5e'; ctx.strokeText('TOUCHDOWN', 0, 0);
  ctx.restore();
  const bx = W / 2 - 280, bw = 560, by = 372 + (1 - e) * 40;
  ctx.globalAlpha = e;
  ctx.fillStyle = 'rgba(8,10,14,.94)'; ctx.beginPath(); ctx.moveTo(bx + 20, by); ctx.lineTo(bx + bw, by); ctx.lineTo(bx + bw - 24, by + 58); ctx.lineTo(bx, by + 58); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c8102e'; ctx.fillRect(bx, by + 52, bw - 24, 6);
  ctx.fillStyle = '#d9ac3b'; ctx.beginPath(); ctx.arc(bx + 38, by + 29, 22, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a1405'; ctx.font = '800 24px Oswald, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t.who.num, bx + 38, by + 38);
  ctx.fillStyle = '#fff'; ctx.font = '700 32px Oswald, Impact, sans-serif'; ctx.textAlign = 'left'; ctx.fillText(t.label, bx + 76, by + 40);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.save();
  if (G.shake > 0.3) ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
  drawField(); drawLines(); drawRoutes(); drawBall(); drawPlayers(); drawDust();
  ctx.restore();
  ctx.drawImage(vig, 0, 0);
  G.particles.forEach(p => { ctx.fillStyle = p.c; ctx.globalAlpha = clamp(p.life, 0, 1); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 5); ctx.fillRect(-p.s / 2, -p.s * 0.3, p.s, p.s * 0.6); ctx.restore(); }); ctx.globalAlpha = 1;
  drawTD(); drawScorebug();
}

let last = 0;
function loop(ts) {
  const dt = Math.min(0.033, (ts - last) / 1000 || 0); last = ts;
  try { update(dt); draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.__fb = { G, snap, selectPlay, throwTo, startGame, buildPlay, stopMeter, doJuke, ptr, keys };
})();
